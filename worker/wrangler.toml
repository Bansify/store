# ═══════════════════════════════════════════════════════════════════
# Kiwi Store API Worker — Cloudflare Workers + Cloudflare D1 (`store`)
#
# Secrets (set via Dashboard or `wrangler secret put`):
#   wrangler secret put GITHUB_FILES_TOKEN
# ═══════════════════════════════════════════════════════════════════

name = "store"
main = "src/index.ts"
compatibility_date = "2025-09-01"
keep_vars = true

routes = [
  { pattern = "store.bansify.com/api/*", zone_name = "bansify.com" },
  { pattern = "storeconsole.bansify.com/api/*", zone_name = "bansify.com" },
  { pattern = "storeadmin.bansify.com/api/*", zone_name = "bansify.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "store"
database_id = "a3dc3e71-cf89-4e0a-89d1-693fcf6f227a"

[vars]
APP_NAME = "Kiwi Store"
APP_SHORT_NAME = "Kiwi"
ECOSYSTEM_NAME = "Bansify"
APP_DOMAIN = "bansify.com"
STOREAPP_PACKAGE = "com.gothwad.store"

STORE_HOST = "store"
CONSOLE_HOST = "storeconsole"
ADMIN_HOST = "storeadmin"
STOREAPP_HOST = "store"
STORE_PUBLIC_URL = "https://store.bansify.com"

AUTH_HUB_URL = "https://api.bansify.com"
ACCOUNTS_API_URL = "https://api.bansify.com"
AUTH_SIGNIN_URL = "https://accounts.bansify.com"
ACCOUNTS_WEB_URL = "https://accounts.bansify.com"
OAUTH_CLIENT_ID = "kiwi-store"
ADMIN_USERNAMES = "pawan"

GITHUB_FILES_OWNER = "Bansify"
GITHUB_FILES_REPO = "storefiles"
GITHUB_REPO = "Bansify/storefiles"
GITHUB_BRANCH = "main"

ALLOWED_ORIGINS = ""
